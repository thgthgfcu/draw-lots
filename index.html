<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高二7抽签</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }

  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    z-index: 10;
  }

  .top-bar .round-info {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
  }

  .top-bar .reset-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.45);
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .top-bar .reset-btn:hover {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
  }

  .main-name {
    font-size: clamp(80px, 18vw, 200px);
    font-weight: 900;
    letter-spacing: 12px;
    text-align: center;
    line-height: 1.1;
    transition: all 0.3s ease;
    position: relative;
  }

  .main-name.animate {
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    0%   { transform: scale(0.5); opacity: 0; }
    60%  { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .name-extra {
    text-align: center;
    margin-top: 12px;
    font-size: clamp(16px, 2.5vw, 22px);
    color: rgba(255,255,255,0.4);
    letter-spacing: 3px;
    min-height: 30px;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 28px auto;
  }

  .btn-area {
    margin-top: 16px;
  }

  .draw-btn {
    background: linear-gradient(135deg, #4f9cff, #3b7dd8);
    border: none;
    color: #fff;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 600;
    padding: 18px 72px;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 6px;
    box-shadow: 0 4px 30px rgba(79,156,255,0.25);
    transition: all 0.2s;
  }
  .draw-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 40px rgba(79,156,255,0.4);
  }
  .draw-btn:active {
    transform: translateY(0);
  }
  .draw-btn:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .history {
    margin-top: 40px;
    text-align: center;
    max-width: 700px;
    width: 90%;
  }
  .history-title {
    font-size: 12px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 3px;
    margin-bottom: 12px;
  }
  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .history-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
  }
  .history-item .num {
    color: rgba(255,255,255,0.25);
    margin-right: 4px;
    font-size: 11px;
  }

  .welcome {
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: clamp(40px, 10vw, 100px);
    font-weight: 300;
    letter-spacing: 10px;
    line-height: 1.2;
  }
  .welcome-sub {
    text-align: center;
    color: rgba(255,255,255,0.15);
    font-size: clamp(12px, 2vw, 16px);
    margin-top: 16px;
    letter-spacing: 4px;
  }

  .grade-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 10px;
    letter-spacing: 2px;
  }
  .grade-good  { background: rgba(76,220,100,0.15); color: #4edc64; border: 1px solid rgba(76,220,100,0.25); }
  .grade-mid   { background: rgba(255,200,60,0.15); color: #ffc83c; border: 1px solid rgba(255,200,60,0.25); }
  .grade-bad   { background: rgba(255,90,90,0.15); color: #ff5a5a; border: 1px solid rgba(255,90,90,0.25); }
  .grade-neutral { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.1); }
</style>
</head>

  </div>

    { name:"袁丽萍", seat:7,  group:6,  score:44.1, grade:"中" },
  ],
];

const TOTAL = ROUNDS.length * 5; // 80

let pos = parseInt(localStorage.getItem('drawPos') || '0');
let history = JSON.parse(localStorage.getItem('drawHistory') || '[]');

function save() {
  localStorage.setItem('drawPos', pos);
  localStorage.setItem('drawHistory', JSON.stringify(history));
}

function getGradeClass(grade) {
  if (grade === '好') return 'grade-good';
  if (grade === '差') return 'grade-bad';
  return 'grade-neutral';
}

function render() {
  const content = document.getElementById('content');
  const btnArea = document.getElementById('btnArea');
  document.getElementById('roundInfo').textContent = `第 ${pos} / ${TOTAL} 位`;

  if (pos === 0) {
    content.innerHTML = `
      <div class="welcome">点击下方按钮<br>开始抽签</div>
      <div class="welcome-sub"></div>
      <div class="btn-area" style="margin-top:40px">
        <button class="draw-btn" onclick="drawNext()">开始抽签</button>
      </div>
      <div class="history" id="historySection" style="display:none">
        <div class="history-title">已抽取</div>
        <div class="history-list" id="historyList"></div>
      </div>
    `;
    return;
  }

  const last = history[history.length - 1];
  const gradeClass = getGradeClass(last.grade);

  let historyHtml = '';
  history.forEach((h, i) => {
    historyHtml += `<div class="history-item"><span class="num">${i+1}</span>${h.name}</div>`;
  });

  content.innerHTML = `
    <div class="main-name" id="mainName">${last.name}</div>
    <div class="name-extra">座号 ${last.seat} · 第${last.group}组 · ${last.score}分</div>
    <div style="text-align:center"><span class="grade-badge ${gradeClass}">${last.grade}</span></div>
    <div class="divider"></div>
    <div class="btn-area" id="btnArea">
      ${pos >= TOTAL
        ? `<button class="draw-btn" disabled>已全部抽完（${TOTAL}人）</button>`
        : `<button class="draw-btn" onclick="drawNext()">抽取下一位</button>`
      }
    </div>
    <div class="history">
      <div class="history-title">已抽取 ${history.length} / ${TOTAL}</div>
      <div class="history-list" id="historyList">${historyHtml}</div>
    </div>
  `;
}

function startDraw() {
  pos = 0;
  history = [];
  save();
  drawNext();
}

function drawNext() {
  if (pos >= TOTAL) return;
  const roundIdx = Math.floor(pos / 5);
  const innerIdx = pos % 5;
  const student = ROUNDS[roundIdx][innerIdx];
  history.push(student);
  pos++;
  save();
  render();
  // animate
  const el = document.getElementById('mainName');
  if (el) {
    el.classList.remove('animate');
    void el.offsetWidth;
    el.classList.add('animate');
  }
}

function resetDraw() {
  if (!confirm('确定要重置抽签吗？所有记录将清空。')) return;
  pos = 0;
  history = [];
  save();
  render();
}

function restorePos() {
  pos = 0;
  history = [];
  save();
  render();
}

// init
render();
</script>
